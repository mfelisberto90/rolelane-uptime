# Change these first
owner: mfelisberto90 # Your GitHub organization or username, where this repository lives
repo: rolelane-uptime # The name of this repository

user-agent: 'RoleLane-Upptime-Monitor/1.0 (+https://github.com/mfelisberto90/rolelane-uptime; upptime)'

sites:
  - name: RoleLane Web Platform
    url: https://app.rolelane.co.uk
    expectedStatusCodes:
      - 200
      - 302
    headers:
      - 'User-Agent: RoleLane-Upptime-Monitor/1.0 (+https://github.com/mfelisberto90/rolelane-uptime; upptime)'

notifications:
  - type: discord

status-website:
  # Add your custom domain name, or remove the cname line if you don't have a domain
  # Uncomment the baseUrl line if you don't have a custom domain and add your repo name there
  # cname: demo.upptime.js.org
  baseUrl: /rolelane-uptime
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: RoleLane Status
  introTitle: '**RoleLane** Status & Continuous Uptime Monitor'
  introMessage: Real-time operational status, response times, and incident history for RoleLane Platform.
  navbar:
    - title: Status
      href: /
    - title: RoleLane App
      href: https://app.rolelane.co.uk
    - title: GitHub
      href: https://github.com/mfelisberto90/rolelane-uptime